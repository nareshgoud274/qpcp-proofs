<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Updates · qpcp-proofs</title>
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<header id="site-header"></header>
<main class="wrap">
  <h1>Updates</h1>
  <p class="lede">Milestones, written by the maintainer and published as releases of the repository.</p>
  <p class="small sans"><a id="atom" href="#">Subscribe to the feed</a></p>
  <h2>Verified results</h2>
  <p class="small sans muted" id="verified-note">Loading…</p>
  <ul class="feed" id="verified"></ul>
  <h2>Milestones</h2>
  <p class="muted small sans" id="load-note" aria-live="polite">Loading…</p>
  <div id="releases"></div>
</main>
<footer id="site-footer"></footer>

<script src="assets/site.js"></script>
<script>
(function () {
  var Q = window.QPCP, el = Q.el;
  Q.chrome("updates.html");
  document.getElementById("atom").href = Q.repoUrl + "/releases.atom";

  // Each result with a page of its own: statement, proof, the verification run, review status.
  Q.loadCore().then(function (d) {
    var ul = document.getElementById("verified");
    document.getElementById("verified-note").textContent = Q.verificationLine(d.verification);
    var done = d.steps.filter(function (s) { return s.verified; })
      .sort(function (a, b) { return (a.when || "") < (b.when || "") ? 1 : -1; });
    if (!done.length) ul.appendChild(el("li", { class: "muted", text: "No verified results to show." }));
    done.forEach(function (s) {
      ul.appendChild(el("li", null, [
        el("span", { class: "when", text: s.when ? Q.ago(s.when) : "" }),
        el("span", { class: "what" }, [
          el("span", { class: "mono", text: s.id + " " }), Q.link(Q.stepUrl(s.id), s.title),
          el("span", { class: "muted", text: " · " + s.status + (s.reviewed ? "" : " · not reviewed by a human") })
        ])
      ]));
    });
  }).catch(function () { document.getElementById("verified-note").textContent = Q.verificationLine(null); });

  Q.loadReleases().then(function (rels) {
    var box = document.getElementById("releases");
    var note = document.getElementById("load-note");
    box.textContent = "";
    if (!rels.length) { note.textContent = "No updates published yet."; return; }
    note.textContent = "";
    rels.forEach(function (r) {
      var when = new Date(r.published_at).toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" });
      box.appendChild(el("h2", null, [Q.link(r.url, r.name || r.tag)]));
      box.appendChild(el("p", { class: "small sans muted", text: when + " · " + r.tag }));
      (r.body || "").split(/\n\s*\n/).forEach(function (para) {
        if (para.trim()) box.appendChild(el("p", { text: para.trim() }));
      });
    });
  }).catch(function () { Q.fail(document.getElementById("load-note")); });
})();
</script>
</body>
</html>
