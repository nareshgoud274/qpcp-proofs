name: automerge

# DRY RUN ONLY. This job always passes --dry-run, so it only reports what it
# would merge, and it does not dispatch the status and verify-main workflows.
# The maintainer merges contributions by hand meanwhile, and decides when to
# turn merging on.
#
# Where things stand: no contributed file, new or merged, is built outside a
# bubblewrap sandbox in any workflow; only QPCP.Defs, QPCP.Qudit,
# QPCP.Statements and Mathlib are, and every verdict comes from text exports
# checked outside the sandbox (scripts/sandbox_verify.py). What this does not
# cover is listed in MAINTAINERS.md ("Known limits of the checker"). Lemma
# statements also need an approval from a reviewer listed in reviewers.json.
#
# When enabled, it merges contributions the checker has accepted, so no person
# has to click.
#
# Trust: this workflow always runs the version on main, checks out main only,
# and never runs contributed code. scripts/automerge.py decides from pull
# request metadata read through the GitHub API. Its rules are in that file.

# Event-driven: after every check run, after a review is submitted or
# dismissed (relayed by review-relay, since review events from forks get a
# read-only token), and after a claim changes. The timer is only a backstop:
# scheduled runs have been unreliable on this repository.
on:
  workflow_run:
    workflows: [check, review-relay, claim]
    types: [completed]
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only report what would be merged"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: automerge
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Report what would be merged (dry run only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/automerge.py --dry-run

      # Merges made with the workflow token do not trigger push workflows, so
      # dispatch the ones a merge should start (workflow_dispatch is allowed
      # from the workflow token): the site status and the record check.
      - name: Refresh the site status and re-verify main
        if: false  # disabled while automerge runs in dry-run mode only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run status.yml --repo "$GITHUB_REPOSITORY" || true
          gh workflow run verify-main.yml --repo "$GITHUB_REPOSITORY" || true
