name: expire-claims

# Releases each claim whose holder has not commented on the issue for 24 hours.
#
# Backstop only. The claim workflow releases lapsed claims itself whenever
# someone comments a command, because scheduled runs have been unreliable on
# this repository. Both use scripts/triage.py, checked out from main.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  expire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            scripts/triage.py
            steps.json
          sparse-checkout-cone-mode: false

      - name: Release lapsed claims
        run: python3 -I scripts/triage.py sweep
