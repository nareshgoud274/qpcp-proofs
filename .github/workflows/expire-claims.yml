name: expire-claims

# Releases claims on step issues that have had no activity for 24 hours.
#
# Backstop only. The claim workflow releases lapsed claims itself whenever
# someone tries to claim, because scheduled runs have been unreliable on this
# repository. Both use scripts/expire_claims.sh, checked out from main.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  expire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts/expire_claims.sh
          sparse-checkout-cone-mode: false

      - name: Release stale claims
        run: bash scripts/expire_claims.sh sweep
