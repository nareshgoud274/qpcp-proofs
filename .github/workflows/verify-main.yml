name: verify-main

# Re-checks every lemma, proof and refutation on main with main's own checker. If this goes
# red after a merge, the merged pull request should be reverted.

on:
  push:
    branches: [main]
  # Automatic merges do not trigger push workflows, so also verify on a timer.
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib cache
        run: lake exe cache get

      - name: Check every proof
        run: python3 scripts/check.py all

      # Replay every module of the record through the kernel, one module at a
      # time: a whole-library run loads Mathlib once per module in parallel and
      # runs out of memory. About 15 seconds a module; batch this when the
      # record grows (see MAINTAINERS.md).
      - name: Replay every module with leanchecker
        run: |
          set -euo pipefail
          # Not the root module QPCP: it only imports, and leanchecker treats a
          # name as a prefix, so `QPCP` would mean every module at once.
          mods="$(git ls-files 'QPCP/*.lean' | sed 's/\.lean$//; s#/#.#g')"
          for m in $mods; do
            lake env leanchecker "$m" || { echo "leanchecker found a problem in $m"; exit 1; }
          done
          echo "leanchecker replayed $(printf '%s\n' $mods | wc -l) modules"
