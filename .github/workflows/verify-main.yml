name: verify-main

# Re-checks every lemma, proof and refutation on main. No contributed file is
# built outside a bubblewrap sandbox: only QPCP.Defs, QPCP.Qudit,
# QPCP.Statements and Mathlib are; every contribution is compiled, replayed
# with leanchecker and exported in its own sandbox, and judged outside it from
# its text export (scripts/sandbox_verify.py). If this goes red after a merge,
# the merged pull request should be reverted.

on:
  push:
    branches: [main]
  # Merges made with the workflow token do not trigger push workflows; the
  # automerge workflow dispatches this one after it merges. The timer is a
  # backstop only (scheduled runs have been unreliable on this repository).
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-main
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        # About a minute per contribution. When the record grows past a few
        # hundred, split it: for example ["1/4", "2/4", "3/4", "4/4"].
        shard: ["1/1"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install elan (pinned release, checksum verified)
        run: scripts/install_elan.sh

      - name: Fetch Mathlib cache
        run: lake exe cache get

      - name: Install bubblewrap
        run: scripts/install_sandbox.sh

      - name: Lean-free checks on the record
        run: python3 scripts/check.py scan-all

      - name: Verify every contribution, sandboxed
        env:
          SHARD: ${{ matrix.shard }}
        run: python3 -I scripts/sandbox_verify.py record --shard "$SHARD"
