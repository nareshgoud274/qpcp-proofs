name: claim

# Handles `/claim`, `/renew` and `/release` comments on step issues
# (scripts/triage.py). This workflow always runs the version on main and never
# checks out or runs contributed code: it checks out only scripts/triage.py and
# steps.json from main.
#
# A claim is a courtesy, not a lock (JOIN.md, "Claims"). Exercises need no
# claim. One holder per step, one claimed step per account. There is no
# concurrency group: GitHub keeps only one pending run per group, so a burst
# of comments could drop a claim. Instead, every run replays the comments of
# all open step issues in one pass by their own timestamps and makes every
# assignee match, then re-reads until nothing needs writing; any two runs
# reach the same state (the earliest /claim wins; a /claim by an account that
# already holds a step is not taken).
#
# A claim lapses 24 hours after the holder's own last comment on the issue;
# lapsed claims are released here whenever someone comments a command, and by
# the hourly expire-claims backstop (scheduled runs have been unreliable).

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: read

jobs:
  claim:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.issue.state == 'open' &&
      contains(github.event.issue.labels.*.name, 'step') &&
      (startsWith(github.event.comment.body, '/claim') ||
       startsWith(github.event.comment.body, '/renew') ||
       startsWith(github.event.comment.body, '/release'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ISSUE: ${{ github.event.issue.number }}
      COMMENT_ID: ${{ github.event.comment.id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            scripts/triage.py
            steps.json
          sparse-checkout-cone-mode: false

      - name: Handle the command
        run: python3 -I scripts/triage.py claim-comment "$ISSUE" "$COMMENT_ID"
