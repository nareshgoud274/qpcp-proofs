name: check

# Checks a contribution: a proof, a refutation, or a new lemma statement. Runs
# with a read-only token and no secrets, because it builds code written by
# strangers. No contributed file, new or merged, is built outside a bubblewrap
# sandbox: only QPCP.Defs, QPCP.Qudit, QPCP.Statements and Mathlib are, and
# every verdict comes from checking text exports outside the sandbox
# (scripts/sandbox_verify.py). The maintainer's own pull requests re-check the
# whole record that way and run the attack tests (tests/run_tests.sh).

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # Before anything from the pull request runs: it must add exactly one
      # file under QPCP/Proofs, QPCP/Refutations or QPCP/Lemmas. Then every
      # other file, including this workflow and the scripts, is main's.
      - name: Refuse anything but one new contribution file
        if: github.event.pull_request.user.login != github.repository_owner
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: scripts/ci_contribution.sh gate "$BASE_SHA"

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib cache
        run: lake exe cache get

      - name: Install bubblewrap
        run: scripts/install_sandbox.sh

      - name: Check the pull request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [ "$PR_AUTHOR" = "$REPO_OWNER" ]; then
            echo "Maintainer pull request: re-checking the whole record, every contribution sandboxed."
            python3 scripts/check.py scan-all
            python3 -I scripts/sandbox_verify.py record
            exit 0
          fi
          scripts/ci_contribution.sh check "$BASE_SHA"

      # For an accepted lemma statement: the kernel's rendering of it, made
      # outside the sandbox from the verified export, for the reviewer. The
      # statement-preview workflow checks it belongs to this pull request and
      # posts it.
      - name: Prepare the statement preview
        if: success() && github.event.pull_request.user.login != github.repository_owner
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          r="$RUNNER_TEMP/qpcp-verify/result"
          [ -f "$r/statement-preview.txt" ] || exit 0
          mkdir -p "$RUNNER_TEMP/preview"
          python3 -I - "$r" "$RUNNER_TEMP/preview/preview.json" <<'PY'
          import json, os, sys
          from pathlib import Path
          r = Path(sys.argv[1]); c = json.loads((r / "contribution.json").read_text())
          Path(sys.argv[2]).write_text(json.dumps({
              "pr": int(os.environ["PR_NUMBER"]), "head_sha": os.environ["HEAD_SHA"],
              "ident": c["ident"], "text": (r / "statement-preview.txt").read_text()[:20000]}))
          PY

      - name: Upload the statement preview
        if: success() && github.event.pull_request.user.login != github.repository_owner
        uses: actions/upload-artifact@v4
        with:
          name: statement-preview
          path: ${{ runner.temp }}/preview/preview.json
          if-no-files-found: ignore
          retention-days: 7

  attack-tests:
    if: github.event.pull_request.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib cache
        run: lake exe cache get

      - name: Install bubblewrap
        run: scripts/install_sandbox.sh

      - name: Merge rules
        run: python3 -I tests/test_automerge.py

      - name: Claim expiry
        run: tests/test_expire_claims.sh

      - name: Statement preview rules
        run: python3 -I tests/test_statement_preview.py

      - name: Attack and honest-contribution tests
        run: tests/run_tests.sh
