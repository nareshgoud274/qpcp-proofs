name: check

# Checks a contribution: a proof, a refutation, or a new lemma statement. Runs
# with a read-only token and no secrets, because it builds code written by
# strangers.
#
# Which workflow runs: a `pull_request` workflow comes from the pull request's
# own merge commit. A pull request that adds exactly one contribution file
# changes nothing else, so for it this file and every script are main's. A
# pull request that changes more than one file, or any file outside
# QPCP/Proofs, QPCP/Refutations and QPCP/Lemmas, runs its own copy of this
# workflow, which can drop the gate below and pass its own check. Its green
# check therefore means nothing: automerge.py merges only pull requests that add
# exactly one contribution file (it reads the file list from the API), and
# such pull requests otherwise wait for the maintainer. No contributed file, new or merged, is built outside a bubblewrap
# sandbox: only QPCP.Defs, QPCP.Qudit, QPCP.Statements, QPCP.Promise and
# Mathlib are, and
# every verdict comes from checking text exports outside the sandbox
# (scripts/sandbox_verify.py). The maintainer's own pull requests re-check the
# whole record that way and run the attack tests (tests/run_tests.sh).
#
# Jobs. `pull-request` checks the contribution (or, on the maintainer's pull
# requests, the whole record). `attack-tests` runs the isolation and
# hostile-input tests. `check` runs last, always, and fails unless every job it
# needs succeeded; the ruleset on main requires exactly that status, `check`,
# so a failing or cancelled attack-tests job blocks a merge. The one allowed
# skip: attack-tests does not run on a contributor's pull request. Its positive
# controls deliberately run Lean files from tests/ with plain Lean, outside any
# sandbox, and on a contributor's pull request those files would be the
# contributor's. It therefore runs on every maintainer pull request, whatever it
# changes (scripts/, tests/, .github/ included), and never on a contributor's;
# a contributor's pull request that changes scripts/, tests/ or .github/ is
# refused by the gate below and never merged automatically (automerge.py).

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pull-request:
    name: pull request
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # Before anything from the pull request runs: it must add exactly one
      # file under QPCP/Proofs, QPCP/Refutations or QPCP/Lemmas. If it does,
      # every other file, including this workflow and the scripts, is main's.
      # (A pull request that changes this workflow runs its own copy, which may
      # not contain this step; see the note at the top.)
      - name: Refuse anything but one new contribution file
        if: github.event.pull_request.user.login != github.repository_owner
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: scripts/ci_contribution.sh gate "$BASE_SHA"

      - name: Install elan (pinned release, checksum verified)
        run: scripts/install_elan.sh

      - name: Fetch Mathlib cache
        run: lake exe cache get

      - name: Install bubblewrap
        run: scripts/install_sandbox.sh

      - name: Check the pull request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # The verifier's own work directory; the preview step below reads its results.
          QPCP_WORK: ${{ runner.temp }}/qpcp-verify-pr
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [ "$PR_AUTHOR" = "$REPO_OWNER" ]; then
            echo "Maintainer pull request: re-checking the whole record, every contribution sandboxed."
            python3 scripts/check.py scan-all
            python3 -I scripts/sandbox_verify.py record
            exit 0
          fi
          scripts/ci_contribution.sh check "$BASE_SHA"

      # For an accepted lemma statement: the kernel's rendering of it, made
      # outside the sandbox from the verified export, for the reviewer. The
      # statement-preview workflow checks it belongs to this pull request and
      # posts it.
      - name: Prepare the statement preview
        if: success() && github.event.pull_request.user.login != github.repository_owner
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          QPCP_WORK: ${{ runner.temp }}/qpcp-verify-pr
        run: |
          set -euo pipefail
          r="$QPCP_WORK/result"
          [ -f "$r/statement-preview.txt" ] || exit 0
          mkdir -p "$RUNNER_TEMP/preview"
          python3 -I - "$r" "$RUNNER_TEMP/preview/preview.json" <<'PY'
          import json, os, sys
          from pathlib import Path
          r = Path(sys.argv[1]); c = json.loads((r / "contribution.json").read_text())
          Path(sys.argv[2]).write_text(json.dumps({
              "pr": int(os.environ["PR_NUMBER"]), "head_sha": os.environ["HEAD_SHA"],
              "ident": c["ident"], "text": (r / "statement-preview.txt").read_text()[:20000]}))
          PY

      - name: Upload the statement preview
        if: success() && github.event.pull_request.user.login != github.repository_owner
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: statement-preview
          path: ${{ runner.temp }}/preview/preview.json
          if-no-files-found: ignore
          retention-days: 7

  attack-tests:
    if: github.event.pull_request.user.login == github.repository_owner
    name: attack-tests (${{ matrix.tree }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # as-is: the tree of the pull request. S030-S031-tracked: the same
        # tree with files committed at QPCP/Proofs/S030.lean and S031.lean, so
        # that proving a real step cannot break the suite (#131).
        tree: [as-is, S030-S031-tracked]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Only in this job's disposable checkout, never pushed. The files stand
      # in for merged proofs at those paths: they pass the source scanner but
      # are not proofs, and no test builds them (S030-S033 are left open as
      # first-contribution exercises, #135).
      - name: Commit stand-ins at QPCP/Proofs/S030.lean and S031.lean
        if: matrix.tree == 'S030-S031-tracked'
        run: |
          set -euo pipefail
          for id in S030 S031; do
            if [ -e "QPCP/Proofs/$id.lean" ]; then echo "$id is already proved in this tree"; continue; fi
            printf 'import QPCP.Statements\n\n-- Stand-in at the path of a merged proof (attack-tests regression, #131).\n-- Not a proof, and never built.\ntheorem QPCP.Proof.%s : QPCP.Statement.%s := by\n  exact stand_in_for_a_merged_proof\n' "$id" "$id" > "QPCP/Proofs/$id.lean"
          done
          git add QPCP/Proofs
          git -c user.name=qpcp-ci -c user.email=qpcp-ci@example.invalid -c commit.gpgsign=false \
            commit -q --allow-empty -m "attack-tests: stand-ins at QPCP/Proofs/S030.lean and S031.lean"
          git ls-files QPCP/Proofs/S030.lean QPCP/Proofs/S031.lean

      - name: Install elan (pinned release, checksum verified)
        run: scripts/install_elan.sh

      - name: Fetch Mathlib cache
        run: lake exe cache get

      - name: Install bubblewrap
        run: scripts/install_sandbox.sh

      - name: Merge rules
        run: python3 -I tests/test_automerge.py

      - name: Claim expiry
        run: tests/test_expire_claims.sh

      - name: Statement preview rules
        run: python3 -I tests/test_statement_preview.py

      - name: Source scanner cases
        run: python3 -I tests/test_scanner.py

      - name: Command table matches the toolchain and Mathlib
        run: tests/test_command_tokens.sh

      - name: Log output is safe
        run: python3 -I tests/test_logsafe.py

      - name: Actions and elan are pinned
        run: python3 -I tests/test_pins.py

      - name: Untrusted input reaches processes only through the sandbox
        run: python3 -I tests/test_sandbox_static.py

      - name: The sandbox sees only its explicit mounts (needs bubblewrap)
        run: python3 -I tests/test_sandbox_isolation.py

      - name: The host never opens a path a sandbox could plant (needs bubblewrap)
        run: python3 -I tests/test_sandbox_host_paths.py

      - name: A contribution is a regular file, read within its bound
        run: python3 -I tests/test_contribution_files.py

      - name: Verifier runs do not share state; replay-only accepts nothing
        run: python3 -I tests/test_verifier_runs.py

      - name: The test suite never touches uncommitted work (refused, failing, interrupted)
        run: tests/test_suite_safety.sh

      - name: Plant uncommitted S900030 and S900031 for the full run
        id: plant
        run: tests/test_suite_safety.sh plant

      - name: Attack and honest-contribution tests
        run: tests/run_tests.sh

      # Also after a failed or interrupted full run; not when nothing was planted (#128).
      - name: The planted S900030 and S900031 are unchanged after the full run
        if: always() && steps.plant.outcome != 'skipped'
        run: tests/test_suite_safety.sh verify

  # The status the ruleset on main requires. See the note at the top.
  check:
    needs: [pull-request, attack-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every needed job succeeded
        env:
          PULL_REQUEST: ${{ needs.pull-request.result }}
          ATTACK_TESTS: ${{ needs.attack-tests.result }}
          MAINTAINER_PR: ${{ github.event.pull_request.user.login == github.repository_owner }}
        run: |
          echo "pull request: $PULL_REQUEST; attack tests: $ATTACK_TESTS; maintainer's pull request: $MAINTAINER_PR"
          if [ "$PULL_REQUEST" != success ]; then
            echo "the pull-request job did not succeed: $PULL_REQUEST"; exit 1
          fi
          if [ "$MAINTAINER_PR" = true ]; then
            if [ "$ATTACK_TESTS" != success ]; then echo "attack-tests did not succeed: $ATTACK_TESTS"; exit 1; fi
          elif [ "$ATTACK_TESTS" != skipped ]; then
            # The only allowed skip, and on a contributor's pull request the only allowed result.
            echo "attack-tests should not run on a contributor's pull request: $ATTACK_TESTS"; exit 1
          fi
          echo "every needed job succeeded"
