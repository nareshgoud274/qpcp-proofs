name: status

# Builds status.json, the one file the project site reads, and publishes it on
# the `site-data` branch. Visitors' browsers then make no GitHub API calls.
#
# This workflow always runs the version on main, checks out main only, and
# never runs contributed code.
#
# Verdicts ("proved", "refuted") come only from the latest verification record
# (records/<commit>.json on site-data, written by verify-main's publish job).
# Until the first record exists, this workflow publishes nothing, so the site
# never shows unverified verdicts. The site-data branch keeps its history: each
# run adds a commit, without force, after the current tip.

# Event-driven (pushes, issues, pull requests, releases, and a dispatch from
# automerge after it merges). The hourly timer is only a backstop: scheduled
# runs have been unreliable on this repository.
on:
  schedule:
    - cron: "7 * * * *"
  push:
    branches: [main]
  issues:
    types: [opened, closed, reopened, labeled, unlabeled, edited]
  pull_request_target:
    types: [opened, closed, reopened]
  release:
    types: [published, edited, deleted]
  # A new verification record (pushes with the workflow token trigger nothing).
  workflow_run:
    workflows: [verify-main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pull-requests: read

# One run at a time. A burst of events collapses into the run in progress plus
# at most one queued run, so heavy activity cannot pile up or starve the build.
concurrency:
  group: status
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          # The publish step pushes with an explicit token URL, not stored credentials.
          persist-credentials: false

      - name: Fetch the latest verification record
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 -I scripts/site_data.py fetch-latest "github:$REPO" "$RUNNER_TEMP/record.json"
          if [ -f "$RUNNER_TEMP/record.json" ]; then echo "found=true" >> "$GITHUB_OUTPUT"; fi

      - name: Build status.json
        if: steps.latest.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/build_status.py "$RUNNER_TEMP/out/status.json" "$RUNNER_TEMP/record.json"

      - name: Publish status.json on site-data
        if: steps.latest.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: python3 -I scripts/site_data.py publish-status "$RUNNER_TEMP/out/status.json" "github:$REPO"
