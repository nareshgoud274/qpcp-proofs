name: tmp-hardening-ci

# TEMPORARY: verifies the hardening branch on ubuntu-latest before its pull
# request is opened. Read-only token, no secrets. Delete before opening the PR.

on:
  push:
    branches: [v2-hardening]

permissions:
  contents: read

jobs:
  attack-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib cache
        run: lake exe cache get

      - name: Install bubblewrap
        run: scripts/install_sandbox.sh

      - name: Merge rules
        run: python3 -I tests/test_automerge.py

      - name: Attack and honest-contribution tests
        run: tests/run_tests.sh

      - name: Whole record (maintainer path)
        run: python3 scripts/check.py all

      - name: verify-main's per-module replay
        run: |
          set -euo pipefail
          mods="$(git ls-files 'QPCP/*.lean' | sed 's/\.lean$//; s#/#.#g')"
          for m in $mods; do lake env leanchecker "$m" || { echo "leanchecker found a problem in $m"; exit 1; }; done
          echo "leanchecker replayed $(printf '%s\n' $mods | wc -l) modules"

      - name: Simulate contributor pull requests through check.yml's script
        run: |
          set -uo pipefail
          git config user.name qpcp-ci && git config user.email qpcp-ci@users.noreply.github.com
          base="$(git rev-parse HEAD)"; fails=0
          sim() {  # sim <description> <expected verdict prefix> <setup command...>
            local desc="$1" want="$2"; shift 2
            git checkout -q -B sim "$base"; "$@"; git add -A; git commit -qm sim
            out="$( { scripts/ci_contribution.sh gate "$base" && scripts/ci_contribution.sh check "$base"; } 2>&1 | grep -E '^(ACCEPTED|REJECTED|FAULT)' | tail -1 )"
            case "$out" in "$want"*) echo "ok    $desc -> $out" ;; *) echo "FAIL  $desc -> $out"; fails=1 ;; esac
            git checkout -q -f "$base"; git clean -fdq QPCP
          }
          sim "honest lemma" "ACCEPTED: lemma L900001" cp tests/honest/L900001.lean QPCP/Lemmas/L900001.lean
          sim "run_tac attack as a proof" "REJECTED" cp tests/attacks/run_tac.lean QPCP/Proofs/S030.lean
          sim "two files" "REJECTED" sh -c 'cp tests/honest/L900001.lean QPCP/Lemmas/L900001.lean; echo x >> README.md'
          sim "modifies an existing file" "REJECTED" sh -c 'echo "-- x" >> QPCP/Proofs/S001.lean'
          exit $fails
