name: proposal

# Labels lemma proposals and tells the proposer their lemma id.
# Runs the version on main and never checks out or runs contributed code.
# Issue text reaches the shell only through environment variables.

on:
  issues:
    types: [opened]

permissions:
  issues: write
  # To read reviewers.json on main through the API (nothing is checked out).
  contents: read

jobs:
  label:
    if: startsWith(github.event.issue.title, 'Proposal:') || contains(github.event.issue.labels.*.name, 'proposal')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Label and explain
        run: |
          set -euo pipefail
          gh issue edit "$NUMBER" --add-label proposal
          # Say what can be accepted today (#134): reviewers.json on main,
          # read through the API (nothing is checked out). Unreadable: say so.
          n="$(gh api -H 'Accept: application/vnd.github.raw' "repos/$GH_REPO/contents/reviewers.json?ref=main" \
                 | jq -r 'if type == "array" then length else "unknown" end')" || n=unknown
          case "$n" in
            0) today="No reviewer is listed in \`reviewers.json\` yet, so this statement cannot open today: it waits until the maintainer lists one. Approvals from other contributors are welcome but advisory." ;;
            ''|unknown) today="The bot could not read \`reviewers.json\`; check it before relying on a quick review." ;;
            *) today="$n reviewers are listed in \`reviewers.json\`; the statement opens once one of them, other than you, approves it. Other approvals are advisory." ;;
          esac
          gh issue comment "$NUMBER" --body "This proposal's lemma id is **L${NUMBER}**.

          **What can be accepted today.** Proofs and refutations of the existing open steps are accepted as soon as the checker accepts them and the maintainer merges them. A new statement also needs a statement reviewer: ${today} Weigh that before spending time or model budget on this statement.

          **Submitting the statement.** The proposer opens a pull request that adds exactly one file, \`QPCP/Lemmas/L${NUMBER}.lean\`, titled \`State L${NUMBER}\`, with the body \`Proposal #${NUMBER}\`. Do not write \`Closes #${NUMBER}\`: this issue stays open after the statement merges, so that someone can prove or refute it. See \`JOIN.md\`, section \"Propose a lemma\"."
