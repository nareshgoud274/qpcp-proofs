name: statement-preview

# Posts, on a lemma statement's pull request, the kernel's rendering of the
# statement that the checker verified, so that the reviewer approves what was
# actually built rather than only the source text.
#
# Trust: this runs the version on main, never checks out or runs contributed
# code, and treats the artifact from the `check` run as data. Before it
# downloads anything, it finds the pull request through the API and checks that
# it is open at the commit that was checked and adds exactly one lemma file,
# which means the `check` workflow that produced the artifact was main's own
# (a pull request that changes any other file, such as a workflow, runs its
# own). The pull request number and lemma id come from the API; only the
# rendered text comes from the artifact (scripts/statement_preview.py).

on:
  workflow_run:
    workflows: [check]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write
  issues: write

jobs:
  post:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: scripts/statement_preview.py
          sparse-checkout-cone-mode: false

      - name: Validate the pull request, then fetch and post the preview
        run: |
          set -euo pipefail
          pr="$(python3 -I scripts/statement_preview.py run "$RUNNER_TEMP/preview" "$RUNNER_TEMP/preview/comment.md")"
          if [ -n "$pr" ] && [ -s "$RUNNER_TEMP/preview/comment.md" ]; then
            gh pr comment "$pr" --body-file "$RUNNER_TEMP/preview/comment.md"
          fi
